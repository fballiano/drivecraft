name: Build

# Each push builds and tests DriveCraft for macOS, Windows, and Linux.
# A tag `v*` also publishes a release with all packages, and points the cask
# Casks/drivecraft.rb in fballiano/homebrew-tap at it:
#
#   brew tap fballiano/tap
#   brew trust --tap fballiano/tap
#   brew install --cask drivecraft
#
# The tap needs the secret TAP_DEPLOY_KEY: a deploy key with write access to
# fballiano/homebrew-tap only.
#
# A release also updates these channels. Each step runs only when its secret
# is set:
#
#   secret    SCOOP_DEPLOY_KEY     a deploy key with write access to
#                                  fballiano/scoop-bucket only
#   secret    AUR_SSH_PRIVATE_KEY  the SSH key of the AUR account that
#                                  maintains drivecraft-bin
#   secret    WINGET_TOKEN         a classic token with the public_repo scope,
#                                  for pull requests to microsoft/winget-pkgs
#                                  (after the first version is in winget-pkgs)
#
# Flathub builds the Flatpak itself. For a new version, run
# `scripts/flatpak.sh flathub <tag>` and open a pull request in the Flathub
# repository of io.github.fballiano.drivecraft.
#
# macOS signature: for a tag and for a manual run (Actions -> Build -> Run
# workflow), the app gets a Developer ID signature and Apple notarizes it.
# This needs the same settings as Shellyard. To set them, run in a terminal:
#
#   ~/Projects/shellyard/Scripts/setup-signing.sh fballiano/drivecraft
#
#   variable  APPLE_TEAM_ID              the ten-character Team ID
#   secret    DEVELOPER_ID_P12_BASE64    the Developer ID Application
#                                        certificate and its key, .p12, base64
#   secret    DEVELOPER_ID_P12_PASSWORD  the password of that .p12
#   secret    NOTARY_KEY_P8_BASE64       an App Store Connect API key, .p8, base64
#   secret    NOTARY_KEY_ID              the ID of that key
#   secret    NOTARY_ISSUER_ID           the issuer ID of that key
#
# Without APPLE_TEAM_ID, and for a normal push, the app gets an ad-hoc
# signature.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { name: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      SIGN: ${{ contains(matrix.target, 'apple-darwin') && vars.APPLE_TEAM_ID != '' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Install rustup and clang (Windows on Arm)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSfL -o "$RUNNER_TEMP/rustup-init.exe" https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal --default-toolchain none
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          fi
          # ring needs clang for this target.
          if ! command -v clang >/dev/null; then
            choco install llvm -y --no-progress
            echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          fi
      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # A keychain of its own, for this run only.
      - name: Import the Developer ID certificate
        if: env.SIGN == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::error::DEVELOPER_ID_P12_BASE64 is not set. See the top of this file."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          read -r -a existing <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk "/Developer ID Application: .*\\($TEAM_ID\\)/ {print \$2; exit}")"
          if [ -z "$IDENTITY" ]; then
            echo "::error::The .p12 has no Developer ID Application identity of team $TEAM_ID."
            exit 1
          fi
          echo "MACOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
            version="$base-dev.${GITHUB_SHA::7}"
          fi
          scripts/package.sh "$TARGET" "$NAME" "$version"
      - name: Check the signature
        if: env.SIGN == 'true'
        env:
          NAME: ${{ matrix.name }}
        run: |
          APP="target/package.noindex/$NAME/DriveCraft.app"
          for binary in "$APP/Contents/MacOS/"*; do
            echo "== $binary"
            details="$(codesign -dvv "$binary" 2>&1)"
            echo "$details" | grep -E "Authority=Developer ID Application|TeamIdentifier|flags|Timestamp"
            echo "$details" | grep -q "TeamIdentifier=$TEAM_ID" \
              || { echo "::error::$binary is not signed by team $TEAM_ID"; exit 1; }
            echo "$details" | grep -q "(runtime)" \
              || { echo "::error::$binary has no hardened runtime"; exit 1; }
            echo "$details" | grep -q "^Timestamp=" \
              || { echo "::error::$binary has no secure timestamp"; exit 1; }
          done
      - name: Notarize
        if: env.SIGN == 'true'
        env:
          NAME: ${{ matrix.name }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/notarize.sh "target/package.noindex/$NAME/DriveCraft.app" dist/DriveCraft-*-"$NAME".zip
      - uses: actions/upload-artifact@v7
        with:
          name: drivecraft-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # An installer for winget, made from the Windows zip files.
  windows-installer:
    name: Windows installers
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: drivecraft-windows-*
          path: dist
          merge-multiple: true
      - name: Install Inno Setup
        run: |
          if ! command -v iscc >/dev/null; then
            if [ ! -f "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
              choco install innosetup -y --no-progress
            fi
            echo "C:/Program Files (x86)/Inno Setup 6" >> "$GITHUB_PATH"
          fi
      - name: Build the installers
        run: scripts/windows-installer.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: drivecraft-windows-installers
          path: dist/*-setup.exe
          if-no-files-found: error

  # A test build of the Flatpak. Flathub makes the published one.
  flatpak:
    name: Flatpak (test build)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: List the crates for the offline build
        run: scripts/flatpak.sh sources
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.fballiano.drivecraft.yml
          bundle: flatpak-test.flatpak
          artifact-name: flatpak-test
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}

  # Builds and checks the AUR package with the Linux package of this run.
  aur-check:
    name: AUR package (check)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: drivecraft-linux-x64
          path: dist
      - name: Build the package in Arch Linux
        run: |
          set -euo pipefail
          # makepkg takes no "-" in a version, so the check uses 0.0.0.
          mv dist/DriveCraft-*-linux-x64.tar.gz dist/DriveCraft-0.0.0-linux-x64.tar.gz
          cp dist/DriveCraft-0.0.0-linux-x64.tar.gz dist/DriveCraft-0.0.0-linux-arm64.tar.gz
          docker run --rm -v "$PWD:/src:ro" archlinux:base-devel bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed namcap >/dev/null
            useradd -m builder
            mkdir /work && chown builder /work
            su builder -c "/src/scripts/aur.sh 0.0.0 /src/dist /work/pkg"
            cp /src/dist/DriveCraft-0.0.0-linux-x64.tar.gz /work/pkg/ && chown builder /work/pkg/*
            su builder -c "cd /work/pkg && makepkg --nodeps --noconfirm"
            pkg=$(ls /work/pkg/drivecraft-bin-*.pkg.tar.zst)
            namcap /work/pkg/PKGBUILD "$pkg"
            for f in usr/bin/drivecraft usr/lib/drivecraft/drivecraft usr/lib/drivecraft/rclone \
                     usr/share/applications/io.github.fballiano.drivecraft.desktop \
                     usr/share/metainfo/io.github.fballiano.drivecraft.metainfo.xml \
                     usr/share/icons/hicolor/256x256/apps/io.github.fballiano.drivecraft.png \
                     usr/share/licenses/drivecraft-bin/LICENSE-MIT; do
              bsdtar -tf "$pkg" | grep -qx "$f" || { echo "::error::$f is missing in the package"; exit 1; }
            done
            echo "The package has all files."
          '

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build, windows-installer, aur-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # The steps for Scoop, the AUR, and winget run only when their secret is set.
    env:
      SCOOP_DEPLOY_KEY: ${{ secrets.SCOOP_DEPLOY_KEY }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: drivecraft-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --title "DriveCraft ${TAG#v}"

      # The cask lives in fballiano/homebrew-tap. The secret TAP_DEPLOY_KEY is
      # a deploy key with write access to that repository only.
      - name: Check out the Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: fballiano/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: homebrew-tap

      # The workflow writes the whole cask, so the first release creates it.
      - name: Point the cask at the release
        working-directory: homebrew-tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          ARM_SHA=$(sha256sum "../dist/DriveCraft-$VERSION-macos-arm64.zip" | cut -d' ' -f1)
          INTEL_SHA=$(sha256sum "../dist/DriveCraft-$VERSION-macos-x64.zip" | cut -d' ' -f1)
          cat > Casks/drivecraft.rb <<EOF
          # The release workflow of fballiano/drivecraft writes this file.
          cask "drivecraft" do
            arch arm: "arm64", intel: "x64"

            version "$VERSION"
            sha256 arm:   "$ARM_SHA",
                   intel: "$INTEL_SHA"

            url "https://github.com/fballiano/drivecraft/releases/download/v#{version}/DriveCraft-#{version}-macos-#{arch}.zip"
            name "DriveCraft"
            desc "Open source replacement for the OneDrive, Dropbox, and Box apps"
            homepage "https://github.com/fballiano/drivecraft"

            depends_on :macos

            app "DriveCraft.app"

            # Only the settings. The synced files in ~/DriveCraft stay.
            zap trash: "~/Library/Application Support/drivecraft"
          end
          EOF
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "The tap already holds version $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/drivecraft.rb
          git commit -m "Point drivecraft at $VERSION"
          # Another application can push to the tap at the same time.
          for _ in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1

      # The Scoop bucket fballiano/scoop-bucket. The secret SCOOP_DEPLOY_KEY is
      # a deploy key with write access to that repository only.
      - name: Check out the Scoop bucket
        if: env.SCOOP_DEPLOY_KEY != ''
        uses: actions/checkout@v7
        with:
          repository: fballiano/scoop-bucket
          ssh-key: ${{ secrets.SCOOP_DEPLOY_KEY }}
          path: scoop-bucket
      - name: Point the Scoop manifest at the release
        if: env.SCOOP_DEPLOY_KEY != ''
        working-directory: scoop-bucket
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          X64=$(sha256sum "../dist/DriveCraft-$VERSION-windows-x64.zip" | cut -d' ' -f1)
          ARM64=$(sha256sum "../dist/DriveCraft-$VERSION-windows-arm64.zip" | cut -d' ' -f1)
          mkdir -p bucket
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256_X64@/$X64/" -e "s/@SHA256_ARM64@/$ARM64/" \
            ../packaging/scoop/drivecraft.json.in > bucket/drivecraft.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "The bucket already holds version $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/drivecraft.json
          git commit -m "drivecraft: Update to version $VERSION"
          for _ in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1

      # The AUR package drivecraft-bin. The secret AUR_SSH_PRIVATE_KEY is the
      # SSH key of the AUR account that maintains it.
      - name: Push drivecraft-bin to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # makepkg makes .SRCINFO; it runs only in Arch Linux.
          docker run --rm -v "$PWD:/src" archlinux:base-devel bash -euo pipefail -c "
            useradd -m builder && mkdir /work && chown builder /work
            su builder -c '/src/scripts/aur.sh $VERSION /src/dist /work/aur'
            mkdir -p /src/target/aur && cp /work/aur/PKGBUILD /work/aur/.SRCINFO /src/target/aur/
          "
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/drivecraft-bin.git aur-repo
          cp target/aur/PKGBUILD target/aur/.SRCINFO aur-repo/
          cd aur-repo
          if [ -z "$(git status --porcelain)" ]; then
            echo "The AUR already holds version $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to $VERSION"
          git push origin HEAD:master

      # winget: a pull request to microsoft/winget-pkgs, from the fork of the
      # owner of the token. This works only after the first version of
      # FabrizioBalliano.DriveCraft is in winget-pkgs (scripts/winget.sh).
      - name: Send the new version to winget
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: FabrizioBalliano.DriveCraft
          release-tag: ${{ github.ref_name }}
          installers-regex: '-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
