[package]
name = "drivecraft"
description = "An open source OneDrive client on top of rclone."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drivecraft-core.workspace = true
eframe = { version = "0.37", features = ["persistence"] }
jiff = "1"
resvg = "0.50"
rfd = "0.18"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.26"

# Shows the Dock icon only while the window is open (main.rs, set_dock_icon).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }

[build-dependencies]
sha2 = "0.11"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
