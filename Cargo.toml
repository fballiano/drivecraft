[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
drivecraft-core = { path = "crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
